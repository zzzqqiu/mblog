# ============================================================
# 推送代码到 main 后自动构建并推送 Docker Hub 镜像
#
# 前提: 在 GitHub 仓库 Settings → Secrets and variables → Actions
#   添加两个 secrets:
#     DOCKERHUB_USERNAME = withrubia
#     DOCKERHUB_TOKEN    = dckr_pat_xxx (Docker Hub Personal Access Token)
#
# 产物:
#   withrubia/mblog-allinone:friends + latest   (前端含朋友圈主题 + 后端)
#   withrubia/mblog-front:friends + latest      (纯前端)
# ============================================================
name: Build & Push Docker Images

on:
  push:
    branches: [main]
    # 只有这些路径变化才构建,避免改 README 也触发
    paths:
      - 'mblog-front/**'
      - 'backend-main/**'
      - 'Dockerfile-allinone'
      - 'maven-settings.xml'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch: # 支持手动触发

env:
  IMAGE_PREFIX: withrubia

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- All-in-One 镜像(朋友圈主题前端 + 后端) ----------
      - name: Build & push mblog-allinone
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-allinone
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mblog-allinone:friends
            ${{ env.IMAGE_PREFIX }}/mblog-allinone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 纯前端镜像 ----------
      - name: Build & push mblog-front
        uses: docker/build-push-action@v6
        with:
          context: ./mblog-front
          file: mblog-front/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mblog-front:friends
            ${{ env.IMAGE_PREFIX }}/mblog-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
